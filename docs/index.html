<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Autocarros da Guarda</title>
  <meta name="description" content="Mapa das linhas e horários dos autocarros urbanos da Guarda.">
  <meta name="theme-color" content="#1f6f5c">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 2h12a3 3 0 0 1 3 3v12a2 2 0 0 1-1 1.7V21a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-2H7v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2.3A2 2 0 0 1 3 17V5a3 3 0 0 1 3-3Zm0 3v6h12V5H6Zm1.5 8a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Zm9 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3Z"/></svg>
    <h1>Autocarros da Guarda</h1>
    <div class="datebox">
      <button id="today" class="today" type="button" hidden>Hoje</button>
      <input id="date" type="date" aria-label="Dia dos horários">
    </div>
  </header>
  <nav id="lines" class="lines" aria-label="Linhas"></nav>
  <main class="layout">
    <aside id="panel" class="panel" aria-live="polite"></aside>
    <div class="mapwrap">
      <div id="map" role="application" aria-label="Mapa das linhas"></div>
      <button id="locate" class="fab" type="button" title="Paragens perto de mim" aria-label="Paragens perto de mim">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm9 3h-2.07A7 7 0 0 0 13 5.07V3h-2v2.07A7 7 0 0 0 5.07 11H3v2h2.07A7 7 0 0 0 11 18.93V21h2v-2.07A7 7 0 0 0 18.93 13H21v-2Zm-9 6a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z"/></svg>
      </button>
    </div>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
